sentence=Lightweight, zero-dependency button library with debounce, multi-clicks, hold, step, and custom event sources.
paragraph=A fast and reliable button library inspired by EncButton and GyverButton. Supports multiple clicks counting, long hold, auto-repeat steps, debouncing, and an abstract base class to support custom sources (such as ESP32 capacitive touch, ADC, etc.). Compatible with Arduino AVR, ESP8266, ESP32 (including core 3.x / platform 8.x), STM32, and RP2040.
